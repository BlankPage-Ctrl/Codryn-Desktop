name: Feature request
description: Suggest an idea or improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who hits it?
      placeholder: When I..., I cannot...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      placeholder: Add / change... so that...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - presentation (components, views)
        - application (actions, stores, logics)
        - core / data layer
        - Go bridge (app.go, internal/)
        - backend connection / spawn
        - packaging / installer
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: I also thought about..., but...
  - type: upload
    id: proof
    attributes:
      label: Proof (optional)
      description: Screenshot or mockup that shows the idea, if any.
    validations:
      required: false
