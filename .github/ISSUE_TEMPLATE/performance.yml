name: Performance report
description: Something is too slow or too heavy.
title: "[perf]: "
labels: ["performance"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: What were you doing when it felt slow?
      placeholder: e.g. opening a workspace with ~500 files
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: Numbers (before / after, if any)
      placeholder: e.g. window took ~20s to become usable
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Windows 11 amd64, backend spawned locally
    validations:
      required: true
  - type: upload
    id: proof
    attributes:
      label: Proof (optional)
      description: Screenshot of timings or profiles, if any.
    validations:
      required: false
