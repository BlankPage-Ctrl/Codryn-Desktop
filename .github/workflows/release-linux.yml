name: release-linux

# Linux release: Wails binary > .deb (nfpm) + portable tarball.
# Triggered by pushing a version tag (e.g. v1.2.3). The tag is the
# single version source: CODRYN_VERSION flows into
# packaging/tools/version, wails.json (synced, CI workspace only),
# the Go binary (ldflags), and nfpm (VERSION, "v" stripped by the tool).
# Local equivalent is documented in packaging/nfpm.yaml and
# internal/version/version.go.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.2.3). No GitHub Release is created for manual runs.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install Wails system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI and nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          CODRYN_VERSION="$TAG" go run ./packaging/tools/version --sync-wails-json
          VER="$(CODRYN_VERSION="$TAG" go run ./packaging/tools/version)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "CODRYN_VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Build (wails)
        run: wails build -clean -tags webkit2_41 -ldflags "-X codryn/desktop/internal/version.Version=${VER}"

      - name: Package (.deb + portable tarball)
        run: |
          mkdir -p dist
          VERSION="${VER}" nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
          tar -czf "dist/codryn-desktop-${VER}-linux-amd64.tar.gz" -C build/bin codryn-desktop
          ( cd dist && sha256sum *.deb *.tar.gz > SHA256SUMS-linux.txt )
          ls -la dist

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
          fail_on_unmatched_files: true

      - name: Upload artifacts (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: codryn-desktop-${{ env.VER }}-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
