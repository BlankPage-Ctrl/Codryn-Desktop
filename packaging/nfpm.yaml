# nfpm config for the Codryn desktop Linux .deb (system-wide install).
# Run from Codryn-Desktop/ so the relative src paths below resolve:
#   Dev:
#     VERSION=0.0.0 go run ./packaging/tools/version # prints resolved version
#     VERSION=0.0.0 nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
#   Release (single version source, leading "v" stripped by internal/version):
#     VERSION=$(CODRYN_VERSION=v1.2.3 go run ./packaging/tools/version) nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
# VERSION is normalized semver without a leading "v".
# It defaults to 0.0.0 for local builds.
name: codryn-desktop
arch: amd64
platform: linux
version: "${VERSION}"
release: "1"
section: utils
priority: optional
maintainer: BlankPage-Ctrl <wilfredowidjadmiko@gmail.com>
description: Codryn desktop client
vendor: Codryn
license: MIT

# Wails WebView2/WebKitGTK runtime deps for Ubuntu 24.04 and newer.
# For Ubuntu 22.04 replace libwebkit2gtk-4.1-0 with libwebkit2gtk-4.0-37.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

contents:
  # GUI binary built by `wails build` (wails.json outputfilename).
  - src: ./build/bin/codryn-desktop
    dst: /usr/bin/codryn-desktop
    file_info:
      mode: 0755

  # App menu entry. No desktop shortcut is shipped on purpose.
  - src: ./packaging/codryn-desktop.desktop
    dst: /usr/share/applications/codryn-desktop.desktop
    file_info:
      mode: 0644

  # hicolor icons backing `Icon=codryn-desktop` in the desktop entry.
  - src: ./packaging/icons/hicolor/16x16/apps/codryn.png
    dst: /usr/share/icons/hicolor/16x16/apps/codryn-desktop.png
    file_info:
      mode: 0644
  - src: ./packaging/icons/hicolor/32x32/apps/codryn.png
    dst: /usr/share/icons/hicolor/32x32/apps/codryn-desktop.png
    file_info:
      mode: 0644
  - src: ./packaging/icons/hicolor/48x48/apps/codryn.png
    dst: /usr/share/icons/hicolor/48x48/apps/codryn-desktop.png
    file_info:
      mode: 0644
  - src: ./packaging/icons/hicolor/64x64/apps/codryn.png
    dst: /usr/share/icons/hicolor/64x64/apps/codryn-desktop.png
    file_info:
      mode: 0644
  - src: ./packaging/icons/hicolor/128x128/apps/codryn.png
    dst: /usr/share/icons/hicolor/128x128/apps/codryn-desktop.png
    file_info:
      mode: 0644
  - src: ./packaging/icons/hicolor/256x256/apps/codryn.png
    dst: /usr/share/icons/hicolor/256x256/apps/codryn-desktop.png
    file_info:
      mode: 0644
  - src: ./packaging/icons/hicolor/512x512/apps/codryn.png
    dst: /usr/share/icons/hicolor/512x512/apps/codryn-desktop.png
    file_info:
      mode: 0644

  # Size-agnostic fallback for environments without a hicolor theme.
  - src: ./packaging/icons/hicolor/256x256/apps/codryn.png
    dst: /usr/share/pixmaps/codryn-desktop.png
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/scripts/postinst
  postremove: ./packaging/scripts/postrm

deb:
  compression: gzip
